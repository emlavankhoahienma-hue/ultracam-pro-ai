name: Build & Release UltraCam Pro IPA

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Unsigned IPA & Deploy Release
    runs-on: macos-14

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Build Xcode Archive (Unsigned)
        run: |
          xcodebuild archive \
            -project UltraCamPro.xcodeproj \
            -scheme UltraCamPro \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "build/UltraCamPro.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS=NO

      - name: Package Payload into IPA
        run: |
          mkdir -p build/ipa/Payload
          cp -r "build/UltraCamPro.xcarchive/Products/Applications/UltraCamPro.app" "build/ipa/Payload/"
          cd build/ipa
          zip -r -q ../../UltraCamPro-v2.0.0-unsigned.ipa Payload
          cd ../..
          ls -lh UltraCamPro-v2.0.0-unsigned.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UltraCamPro-v2.0.0-unsigned
          path: UltraCamPro-v2.0.0-unsigned.ipa
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v2.0.0-${{ github.sha }}
          name: "UltraCam Pro Release v2.0.0 (${{ github.sha }})"
          body: |
            ### 🚀 UltraCam Pro v2.0.0 Release
            
            **Highlights & Features:**
            - 🔬 **AI 0.5x Ultra-Wide Shader**: Inverse barrel distortion with bilinear anti-aliasing on Metal 3.0.
            - ⚡ **Zero-Latency Face Tracking**: Direct Apple Neural Engine Vision Pipeline (0.000001s response).
            - 🎯 **Continuous AI Auto Focus**: Real-time POI coordinate mapping to hardware lens.
            - 🎬 **Capture Suite**: 4K 60fps Video, Apple ProRAW DNG, and Live Photo.
            - 🎛 **Native UI**: Zoom dial wheel, fluid ramping, haptic ticks, and settings calibration.
            
            *Unsigned IPA attached below. Sideload via TrollStore, AltStore, SideStore, or Scarlet.*
          files: |
            UltraCamPro-v2.0.0-unsigned.ipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
